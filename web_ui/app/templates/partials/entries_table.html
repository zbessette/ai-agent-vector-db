<div class="bg-white rounded-lg border border-slate-200 overflow-x-auto">
  <table class="w-full text-sm">
    <thead class="bg-slate-50 text-left">
      <tr>
        <th class="px-4 py-2">ID</th>
        <th class="px-4 py-2">Type</th>
        <th class="px-4 py-2">Text</th>
        <th class="px-4 py-2">Created</th>
        <th class="px-4 py-2"></th>
      </tr>
    </thead>
    <tbody>
      {% for e in entries %}
      <tr class="border-t border-slate-100" id="entry-{{ e.id }}">
        <td class="px-4 py-2 font-mono text-xs">{{ e.id }}</td>
        <td class="px-4 py-2">{{ e.payload.entry_type }}</td>
        {% set text = e.payload.original_text or '' %}
        <td class="px-4 py-2">{{ text[:120] }}{% if text|length > 120 %}…{% endif %}</td>
        <td class="px-4 py-2 text-xs text-slate-500">{{ e.payload.created_at }}</td>
        <td class="px-4 py-2 text-right">
          <button class="text-blue-600 hover:underline" onclick="window.openEditEntry('{{ ns.name }}', '{{ e.id }}')">Edit</button>
          <button class="text-red-600 hover:underline ml-2" onclick="window.deleteEntry('{{ ns.name }}', '{{ e.id }}')">Delete</button>
        </td>
      </tr>
      {% else %}
      <tr><td class="px-4 py-3 text-slate-500" colspan="5">No entries yet.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
